server:
  port: 8080

spring:
  application:
    name: enterprise-invoice-approval

  # Local development defaults matching docker-compose.yml
  datasource:
    url: jdbc:postgresql://localhost:5432/expense_tracker
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # the schema is owned by Liquibase; Hibernate only checks it
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/ledgerflow

application:
  minio:
    url: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: invoices
