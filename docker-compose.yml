services:
  postgres:
    image: postgres:15-alpine
    container_name: expense_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # S3-compatible file storage
  minio:
    image: minio/minio
    container_name: expense_minio
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # Identity provider (realm "ledgerflow", see README)
  keycloak:
    image: quay.io/keycloak/keycloak:23.0.0
    container_name: expense_keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev
    ports:
      - "8081:8080"

  # Creates the "invoices" bucket on first start. The bucket stays private.
  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c " /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin; /usr/bin/mc mb myminio/invoices; exit 0; "

volumes:
  postgres_data:
  minio_data:
